name: CI Pipeline

on:
  push:
    branches: [main, portfolio-demo]
  pull_request:
    branches: [main, portfolio-demo]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Build, Test & Security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoa77_ci_test?schema=public
      JWT_ACCESS_SECRET: dev-jwt-access-secret-32-chars-minimum-key-aoa77-doc-app
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-32-chars-minimum-key-aoa77-doc-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backend security and unit tests
        run: npm run test

      - name: Verify production build
        run: npm run build

  frontend-ci:
    name: Frontend CI (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript build verification
        run: npx tsc -b

      - name: Run production bundle build
        run: npm run build
